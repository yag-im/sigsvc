[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{ name = "acme-im" }]
description = "yag signaling service"
keywords = ["signaling"]
name = "sigsvc"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.14,<4"
dependencies = [
    "aiohttp>=3.12.14,<4",
    "aiohttp-retry>=2.8.3,<3",
    "itsdangerous>=2.1.2,<3",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "pydantic>=2.12,<3",
    "websockets>=12.0,<13",
    "werkzeug>=3.0.6,<4",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-dotenv",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["sigsvc"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "UP",  # pyupgrade
    "PL",  # pylint
    "G",   # flake8-logging-format
    "LOG", # flake8-logging
]
ignore = [
    "UP006",   # keep `typing.Dict/List/...` style
    "UP045",   # keep `typing.Optional` style
    "LOG015",  # root logger is used by design (`import logging as log`)
    "G004",    # f-strings in logging calls are allowed
    "N818",
    "PLR0912",
    "PLR2004",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/dto.py" = ["N815"]
"**/dto/*.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["sigsvc"]

[tool.pyright]
include = ["sigsvc"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-s -v"
env_files = [
    "tests/pytest.env"
]
markers = [
    "integration: marks integration tests",
    "unit: marks unittests"
]
testpaths = "tests"
